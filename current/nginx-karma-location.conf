# KARMA mounted below /karma/ inside the existing HTTPS server block.
# This snippet intentionally does not set client_max_body_size at server scope.

location = /karma {
    return 301 /karma/;
}

location ^~ /karma/static/ {
    alias /var/www/karma/current/staticfiles/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

location ^~ /karma/media/ {
    return 404;
}

location /karma/ {
    client_max_body_size 220M;
    proxy_pass http://unix:/run/karma/karma.sock:/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /karma;
    proxy_redirect off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
