{% extends 'base.html' %}{% load karma_fa %}{% block content %}<div class="page-head"><div><h1>اعلان‌ها</h1><p>رویدادهای مهم پروژه‌ها و کارهای شما</p></div><div class="filter-links"><a href="{% url 'notification_center' %}">همه</a><a href="?unread=1">خوانده‌نشده</a></div></div><div class="panel notification-list">{% for n in notifications %}<a href="{% url 'notification_read' n.pk %}" class="notification-item {% if not n.is_read %}unread{% endif %}"><span class="notification-dot"></span><div><strong>{{n.title}}</strong><p>{{n.body}}</p><small>{{n.created_at|jalali_datetime}}</small></div></a>{% empty %}<div class="empty">اعلانی وجود ندارد.</div>{% endfor %}</div>{% endblock %}
