{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">{{project.workspace.name}}</div><h1>دسترسی اعضا به {{project.name}}</h1><p>عضویت در میزکار به معنی دسترسی خودکار به این پروژه نیست.</p></div></div><div class="panel"><form method="post">{% csrf_token %}<div class="access-list">{% for m in workspace_members %}<label class="access-row"><input class="form-check-input" type="checkbox" name="members" value="{{m.pk}}" {% if m.pk|stringformat:'s' in active_ids %}checked{% endif %}><span class="avatar">{{m.name|slice:':1'}}</span><div><strong>{{m.name}}</strong><small>{{m.phone}} · {{m.get_role_display}}</small></div></label>{% endfor %}</div><button class="btn btn-primary mt-3">ذخیره دسترسی‌ها</button></form></div>{% endblock %}
