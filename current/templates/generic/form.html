{% extends 'base.html' %}
{% block content %}
<div class="page-head"><div><h1>{{title}}</h1>{% if intro %}<p>{{intro}}</p>{% endif %}</div></div>
<div class="panel form-panel">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-danger">{{form.non_field_errors}}</div>{% endif %}
    {{form.as_p}}
    <button class="btn btn-primary">{{submit|default:'ذخیره'}}</button>
  </form>
</div>
{% endblock %}
